<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الخضار والفاكهة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding: 15px; direction: rtl; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; background: #fafafa; }
        input:focus, select:focus { border-color: #27ae60; outline: none; background: #fff; }
        .btn { width: 100%; background: #27ae60; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        .btn:hover { background: #219653; }
        .result-box { margin-top: 25px; background: #e8f8f5; border: 1px solid #a3e4d7; padding: 15px; border-radius: 8px; text-align: center; }
        .result-box h3 { color: #117a65; margin-bottom: 5px; font-size: 16px; }
        .result-value { font-size: 24px; font-weight: bold; color: #0e6251; }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة الخضار والفاكهة</h2>
    
    <div class="form-group">
        <label for="itemSelect">اختر الصنف:</label>
        <select id="itemSelect" onchange="updatePrice()">
            <option value="5" data-price="5">طماطم (5 ريال للكيلو)</option>
            <option value="4" data-price="4">خيار (4 ريال للكيلو)</option>
            <option value="6" data-price="6">بطاطس (6 ريال للكيلو)</option>
            <option value="8" data-price="8">بصل (8 ريال للكيلو)</option>
            <option value="10" data-price="10">موز (10 ريال للكيلو)</option>
            <option value="12" data-price="12">تفاح (12 ريال للكيلو)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="pricePerUnit">سعر الكيلو (ريال):</label>
        <input type="number" id="pricePerUnit" value="5" readonly>
    </div>

    <div class="form-group">
        <label for="weight">الوزن / الكمية (بالكيلو أو العدد):</label>
        <input type="number" id="weight" placeholder="أدخل الكمية هنا" inputmode="decimal">
    </div>

    <button class="btn" onclick="calculateTotal()">احساب المجموع</button>

    <div class="result-box">
        <h3>المجموع الإجمالي</h3>
        <div class="result-value" id="totalResult">0.00 ريال</div>
    </div>
</div>

<script>
    function updatePrice() {
        const select = document.getElementById('itemSelect');
        const price = select.options[select.selectedIndex].getAttribute('data-price');
        document.getElementById('pricePerUnit').value = price;
    }

    function calculateTotal() {
        const price = parseFloat(document.getElementById('pricePerUnit').value) || 0;
        const weight = parseFloat(document.getElementById('weight').value) || 0;
        const total = price * weight;
        document.getElementById('totalResult').innerText = total.toFixed(2) + ' ريال';
    }
</script>

</body>
</html>
